<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PepsiJeger 🎯</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="pepsijeger_icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="pepsijeger_icon-512.png">
  <link rel="apple-touch-icon" href="pepsijeger_icon-192.png">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    button { background: #0085ff; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
    button:active { background: #0066cc; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 10px; font-size: 16px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #2a2a2a; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .del-btn { background: #e32934; width: auto; padding: 6px 12px; font-size: 13px; }
    .add-store-btn { background: #22c55e; width: auto; padding: 6px 12px; font-size: 13px; }
    .status-text { font-size: 13px; color: #aaa; margin: 8px 0; }
    #err-msg { display: none; background: #3b181a; color: #ff8080; border: 1px solid #ff4d4d; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 13px; word-break: break-word; }
    
    .deal-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 12px 0; }
    .deal-item:last-child { border-bottom: none; }
    .deal-title { font-weight: bold; font-size: 15px; color: #fff; }
    .deal-store { font-size: 12px; color: #888; margin-top: 3px; }
    .deal-price { font-size: 18px; font-weight: bold; color: #4ade80; text-align: right; }
    
    .store-search-result { background: #242424; border: 1px solid #3a3a3a; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div id="err-msg"></div>

  <!-- Dagens Funn -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="margin: 0;">🔥 Dagens Funn</h3>
      <button type="button" onclick="oppdaterOgSynkLive()" style="width: auto; padding: 6px 12px; font-size: 13px;">Oppdater</button>
    </div>
    <div id="deal-list">
      <p class="status-text">Laster tilbud...</p>
    </div>
  </div>

  <!-- Mine Fysiske Butikker -->
  <div class="card">
    <h3>🏪 Mine Butikker</h3>
    <p class="status-text">Søk opp og legg til butikkene du handler i:</p>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="store-search-input" placeholder="f.eks. Hareid, Ulsteinvik, Extra, Kiwi..." style="margin-bottom: 8px;" oninput="sokButikker(this.value)">
    </div>
    <div id="store-search-results"></div>
    <ul id="my-stores-list" style="margin-top: 12px;"></ul>
  </div>

  <!-- Områder / Postnummer -->
  <div class="card">
    <h3>📍 Mine Områder / Postnummer</h3>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="postal-input" placeholder="Postnr" style="flex: 1;" oninput="liveOppslagPostnr(this.value)">
      <input type="text" id="place-input" placeholder="Sted" style="flex: 1.5;" oninput="liveOppslagSted(this.value)">
    </div>
    <button type="button" onclick="leggTilOmraade()">Legg til postnummer</button>
    <ul id="location-list" style="margin-top: 12px;"></ul>
  </div>

  <!-- Overvåkningsliste -->
  <div class="card">
    <h3>🛒 Varer som overvåkes</h3>
    <input type="text" id="item-input" placeholder="f.eks. Hvitost, Kaffe, Grandiosa...">
    <button type="button" onclick="leggTilVare()">Legg til i listen</button>
    <ul id="item-list" style="margin-top: 14px;"></ul>
  </div>

  <script>
    const SUPABASE_URL = "https://kxyahkeooiyalrnknlhd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4eWFoa2Vvb2l5YWxybmtubGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDU3NzgsImV4cCI6MjEwNTQ4MTc3OH0.oqUVTTPm8UR2cVwF9rH0asu310eTSWkQdyZEare-rww";
    const KASSAL_TOKEN = "DQTTX6WmOLeFCWBv5vl6bvu1IMGL1lc2VgYsedqZ3ac736ca";

    const PEPSI_EAN = {
      "Pepsi Max 4-pk (1,5L)": "7044618874687",
      "Pepsi Max 6-pk (1,5L)": "7044613874682"
    };

    let mineValgteButikker = [];

    function visFeil(tekst) {
      const boks = document.getElementById('err-msg');
      boks.style.display = 'block';
      boks.innerText = tekst;
    }

    function skjulFeil() {
      const boks = document.getElementById('err-msg');
      boks.style.display = 'none';
    }

    async function apiKall(sti, options = {}) {
      const headers = {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": options.prefer || "return=minimal",
        ...(options.headers || {})
      };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${sti}`, { ...options, headers });
      if (!res.ok) {
        const errJson = await res.json().catch(() => ({ message: res.statusText }));
        throw new Error(errJson.message || "Feilkode " + res.status);
      }
      const tekst = await res.text();
      return tekst ? JSON.parse(tekst) : null;
    }

    // Normaliser kjedene slik at f.eks. "EUROSPAR Hareid" og "Spar" matcher perfekt
    function normaliserKjede(tekst) {
      const t = (tekst || '').toUpperCase();
      if (t.includes('EXTRA')) return 'EXTRA';
      if (t.includes('BUNNPRIS')) return 'BUNNPRIS';
      if (t.includes('SPAR') || t.includes('EUROSPAR')) return 'SPAR';
      if (t.includes('REMA')) return 'REMA';
      if (t.includes('KIWI')) return 'KIWI';
      if (t.includes('PRIX')) return 'PRIX';
      if (t.includes('MEGA')) return 'MEGA';
      if (t.includes('MENY')) return 'MENY';
      if (t.includes('JOKER')) return 'JOKER';
      if (t.includes('OBS')) return 'OBS';
      return t;
    }

    function erPepsiFlerpakning(produktNavn) {
      const p = (produktNavn || '').toLowerCase().replace(/\s+/g, '');
      const er4 = /(4x1[,.]5|4[-]?pk.*1[,.]5|1[,.]5.*4[-]?pk|4stk.*1[,.]5)/i.test(p);
      const er6 = /(6x1[,.]5|6[-]?pk.*1[,.]5|1[,.]5.*6[-]?pk|6stk.*1[,.]5)/i.test(p);
      return er4 || er6;
    }

    function matcherSoekeord(produktNavn, query) {
      const q = query.trim().toLowerCase();
      const p = (produktNavn || '').toLowerCase();

      if (q.includes(' ')) return p.includes(q);

      const ordListe = p.split(/[\s,./\-_+()%0-9]+/).filter(Boolean);
      for (const ord of ordListe) {
        if (ord === q) return true;
        if (ord.endsWith(q) && ord.length >= q.length + 2) {
          if (q === 'ost' && ord === 'frokost') continue;
          return true;
        }
        if (ord.startsWith(q) && ord.length >= q.length + 2) return true;
      }
      return false;
    }

    // --- Butikksøk mot Kassal Physical Stores API ---
    let debounceStoreTimer = null;
    function sokButikker(verdi) {
      clearTimeout(debounceStoreTimer);
      const q = verdi.trim();
      const container = document.getElementById('store-search-results');
      if (q.length < 2) {
        container.innerHTML = "";
        return;
      }

      debounceStoreTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://kassal.app/api/v1/physical-stores?search=${encodeURIComponent(q)}&size=8`, {
            headers: { "Authorization": `Bearer ${KASSAL_TOKEN}` }
          });
          if (!res.ok) return;
          const json = await res.json();
          const stores = json.data || [];

          container.innerHTML = "";
          if (stores.length === 0) {
            container.innerHTML = '<p class="status-text">Ingen butikker funnet med det navnet.</p>';
            return;
          }

          stores.forEach(s => {
            const navn = s.name || s.name_full || "Butikk";
            const adresse = s.address ? ` (${s.address})` : '';
            const renTekst = navn.replace(/'/g, "\\'");
            const kjede = s.group || s.brand || normaliserKjede(navn);
            container.innerHTML += `
              <div class="store-search-result">
                <span>📍 <strong>${navn}</strong>${adresse}</span>
                <button class="add-store-btn" onclick="leggTilButikk('${s.id || ''}', '${renTekst}', '${kjede.replace(/'/g, "\\'")}')">+ Legg til</button>
              </div>
            `;
          });
        } catch (e) {
          console.warn("Feil ved butikksøk:", e);
        }
      }, 300);
    }

    async function leggTilButikk(storeId, storeName, chainName) {
      try {
        await apiKall('user_stores', {
          method: 'POST',
          body: JSON.stringify({ store_id: String(storeId), store_name: storeName, chain_name: chainName })
        });
        document.getElementById('store-search-input').value = "";
        document.getElementById('store-search-results').innerHTML = "";
        await lastMineButikker();
        oppdaterOgSynkLive();
      } catch (e) {
        visFeil("Kunne ikke lagre butikk: " + e.message);
      }
    }

    async function slettButikk(id) {
      try {
        await apiKall(`user_stores?id=eq.${id}`, { method: 'DELETE' });
        await lastMineButikker();
        oppdaterOgSynkLive();
      } catch (e) {
        visFeil("Kunne ikke slette butikk: " + e.message);
      }
    }

    async function lastMineButikker() {
      try {
        const butikker = await apiKall('user_stores?select=*&order=created_at.asc', { prefer: 'return=representation' });
        mineValgteButikker = butikker || [];
        const liste = document.getElementById('my-stores-list');
        liste.innerHTML = "";

        if (mineValgteButikker.length === 0) {
          liste.innerHTML = '<p class="status-text">Ingen butikker lagt til enda. Søk over for å legge til.</p>';
          return;
        }

        mineValgteButikker.forEach(b => {
          liste.innerHTML += `
            <li>
              <span>🏪 <strong>${b.store_name}</strong></span>
              <button class="del-btn" onclick="slettButikk('${b.id}')">Slett</button>
            </li>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke hente butikkene dine: " + e.message);
      }
    }

    // --- Kartverket Live Oppslag ---
    let debounceTimerSted = null;

    async function liveOppslagPostnr(verdi) {
      const postnr = verdi.trim();
      const stedFelt = document.getElementById('place-input');
      if (postnr.length === 4 && /^\d{4}$/.test(postnr)) {
        try {
          const res = await fetch(`https://ws.geonorge.no/adresser/v1/sok?sok=${encodeURIComponent(postnr)}&treffPerSide=1`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.adresser && data.adresser.length > 0) {
            stedFelt.value = data.adresser[0].poststed;
          }
        } catch (e) {
          console.warn(e);
        }
      }
    }

    function liveOppslagSted(verdi) {
      clearTimeout(debounceTimerSted);
      const sted = verdi.trim();
      const postnrFelt = document.getElementById('postal-input');
      if (sted.length >= 3) {
        debounceTimerSted = setTimeout(async () => {
          try {
            const res = await fetch(`https://ws.geonorge.no/adresser/v1/sok?sok=${encodeURIComponent(sted)}&treffPerSide=1`);
            if (!res.ok) return;
            const data = await res.json();
            if (data.adresser && data.adresser.length > 0) {
              postnrFelt.value = data.adresser[0].postnummer;
            }
          } catch (e) {
            console.warn(e);
          }
        }, 250);
      }
    }

    async function lastOmraader() {
      try {
        const omraader = await apiKall('user_locations?select=*&order=created_at.asc', { prefer: 'return=representation' });
        const liste = document.getElementById('location-list');
        liste.innerHTML = "";
        (omraader || []).forEach(o => {
          liste.innerHTML += `
            <li>
              <span>📮 <strong>${o.postal_code}</strong> ${o.place_name ? `(${o.place_name})` : ''}</span>
              <button class="del-btn" onclick="slettOmraade('${o.id}')">Slett</button>
            </li>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke laste områder: " + e.message);
      }
    }

    async function leggTilOmraade() {
      skjulFeil();
      const pFelt = document.getElementById('postal-input');
      const sFelt = document.getElementById('place-input');
      const postnr = pFelt.value.trim();
      const sted = sFelt.value.trim();
      if (!postnr) return;

      try {
        await apiKall('user_locations', {
          method: 'POST',
          body: JSON.stringify({ postal_code: postnr, place_name: sted })
        });
        pFelt.value = "";
        sFelt.value = "";
        lastOmraader();
      } catch (e) {
        visFeil("Kunne ikke lagre område: " + e.message);
      }
    }

    async function slettOmraade(id) {
      try {
        await apiKall(`user_locations?id=eq.${id}`, { method: 'DELETE' });
        lastOmraader();
      } catch (e) {
        visFeil("Kunne ikke slette område: " + e.message);
      }
    }

    // --- Kassal Datahenting ---
    async function hentFraEan(ean, standardNavn) {
      try {
        const res = await fetch(`https://kassal.app/api/v1/products/ean/${ean}`, {
          headers: { "Authorization": `Bearer ${KASSAL_TOKEN}` }
        });
        if (!res.ok) return [];
        const json = await res.json();
        const d = json.data;
        if (!d) return [];

        let resultater = [];
        const fellesNavn = d.name || standardNavn;

        if (Array.isArray(d.products) && d.products.length > 0) {
          d.products.forEach(p => {
            const prisVerdi = p.current_price ?? p.price ?? 0;
            if (prisVerdi > 0) {
              resultater.push({
                name: p.name || fellesNavn,
                price: prisVerdi,
                store: p.store || { name: p.store_name || "Butikk" }
              });
            }
          });
        } else if (Array.isArray(d.prices) && d.prices.length > 0) {
          d.prices.forEach(p => {
            const prisVerdi = p.price ?? p.current_price ?? 0;
            if (prisVerdi > 0) {
              resultater.push({
                name: fellesNavn,
                price: prisVerdi,
                store: p.store || { name: p.store_name || "Butikk" }
              });
            }
          });
        } else if (d.name) {
          const prisVerdi = d.current_price ?? d.price ?? 0;
          if (prisVerdi > 0) {
            resultater.push({
              name: d.name,
              price: prisVerdi,
              store: d.store || { name: "Butikk" }
            });
          }
        }

        return resultater;
      } catch (e) {
        return [];
      }
    }

    async function hentFraKassal(query) {
      try {
        const res = await fetch(`https://kassal.app/api/v1/products?search=${encodeURIComponent(query)}&size=100`, {
          headers: { "Authorization": `Bearer ${KASSAL_TOKEN}` }
        });
        if (!res.ok) return [];
        const json = await res.json();
        return json.data || [];
      } catch (e) {
        return [];
      }
    }

    function filtrerKassalProdukter(produkter, query, krevFlerpakning = false) {
      return (produkter || []).filter(item => {
        const vareNavn = (item.name || '').trim();
        const pris = Number(item.current_price ?? item.price ?? 0);

        if (!vareNavn || vareNavn.toLowerCase() === 'undefined' || pris <= 0) {
          return false;
        }

        // Butikksjekk
        if (mineValgteButikker.length > 0) {
          const itemButikkNavn = typeof item.store === 'string' 
            ? item.store 
            : (item.store?.name || item.brand || '');
          
          const itemKjedeKjerne = normaliserKjede(itemButikkNavn);

          const matcherButikk = mineValgteButikker.some(b => {
            const minKjedeKjerne = normaliserKjede(b.chain_name || b.store_name);
            const minButikkNavn = (b.store_name || '').toUpperCase();
            const raaItemNavn = itemButikkNavn.toUpperCase();

            // Matcher enten på normalisert kjede (f.eks. SPAR mot EUROSPAR) eller direkte navnelikhet
            return (
              (itemKjedeKjerne && minKjedeKjerne && itemKjedeKjerne === minKjedeKjerne) ||
              raaItemNavn.includes(minButikkNavn) ||
              minButikkNavn.includes(raaItemNavn)
            );
          });

          if (!matcherButikk) return false;
        }

        if (krevFlerpakning) {
          return erPepsiFlerpakning(vareNavn);
        }

        if (query && !matcherSoekeord(vareNavn, query)) {
          return false;
        }

        return true;
      });
    }

    // --- Oppdater Dagens Funn ---
    async function oppdaterOgSynkLive() {
      const container = document.getElementById('deal-list');
      container.innerHTML = '<p class="status-text">Henter ferske tilbud fra Kassal...</p>';
      skjulFeil();

      try {
        let alleFunn = [];

        // 1. EAN-oppslag for Pepsi Max 4-pk og 6-pk (1,5L)
        for (const [tittel, ean] of Object.entries(PEPSI_EAN)) {
          const eanTreff = await hentFraEan(ean, tittel);
          const filtrert = filtrerKassalProdukter(eanTreff, "pepsi", true);
          alleFunn = alleFunn.concat(filtrert);
        }

        // 2. Målrettede søk for å fange opp 4-pk og 6-pk fra Spar, Extra og Bunnpris
        const sokOrdListe = ["pepsi max 6", "pepsi max 4", "pepsi 6 x", "pepsi max 1,5"];
        for (const soek of sokOrdListe) {
          const raaData = await hentFraKassal(soek);
          const filtrert = filtrerKassalProdukter(raaData, "", true);
          alleFunn = alleFunn.concat(filtrert);
        }

        // 3. Hent øvrige varer som overvåkes fra listen
        const varer = await apiKall('watched_items?select=query', { prefer: 'return=representation' });
        if (varer && varer.length > 0) {
          for (const v of varer) {
            if (v.query.toLowerCase().includes('pepsi')) continue;

            const raaData = await hentFraKassal(v.query);
            const filtrert = filtrerKassalProdukter(raaData, v.query, false);
            alleFunn = alleFunn.concat(filtrert);
          }
        }

        // Fjern duplikater
        const unikeFunn = [];
        const sett = new Set();
        for (const item of alleFunn) {
          const butikkNavn = typeof item.store === 'string' ? item.store : (item.store?.name || 'Butikk');
          const pris = Number(item.current_price ?? item.price ?? 0);
          const nøkkel = `${normaliserKjede(butikkNavn)}_${item.name.trim().toLowerCase()}_${pris}`;
          if (!sett.has(nøkkel)) {
            sett.add(nøkkel);
            unikeFunn.push(item);
          }
        }

        if (unikeFunn.length === 0) {
          container.innerHTML = '<p class="status-text">Ingen tilbud funnet for varene dine i de valgte butikkene.</p>';
          return;
        }

        // Sorter laveste pris først
        unikeFunn.sort((a, b) => {
          const prisA = Number(a.current_price ?? a.price ?? 9999);
          const prisB = Number(b.current_price ?? b.price ?? 9999);
          return prisA - prisB;
        });

        container.innerHTML = "";
        unikeFunn.forEach(item => {
          const butikk = typeof item.store === 'string' ? item.store : (item.store?.name || "Butikk");
          const pris = item.current_price ?? item.price ?? 0;
          container.innerHTML += `
            <div class="deal-item">
              <div>
                <div class="deal-title">${item.name}</div>
                <div class="deal-store">📍 ${butikk}</div>
              </div>
              <div class="deal-price">${pris} kr</div>
            </div>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke hente tilbud: " + e.message);
      }
    }

    // --- Overvåkede varer ---
    async function lastVarer() {
      try {
        const varer = await apiKall('watched_items?select=*&order=id.asc', { prefer: 'return=representation' });
        const liste = document.getElementById('item-list');
        liste.innerHTML = "";
        (varer || []).forEach(v => {
          liste.innerHTML += `
            <li>
              <span>${v.query}</span>
              <button class="del-btn" onclick="slettVare('${v.id}')">Slett</button>
            </li>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke hente varer: " + e.message);
      }
    }

    async function leggTilVare() {
      skjulFeil();
      const felt = document.getElementById('item-input');
      const tekst = felt.value.trim();
      if (!tekst) return;

      try {
        await apiKall('watched_items', {
          method: 'POST',
          body: JSON.stringify({ query: tekst })
        });
        felt.value = "";
        await lastVarer();
        oppdaterOgSynkLive();
      } catch (e) {
        visFeil("Kunne ikke legge til vare: " + e.message);
      }
    }

    async function slettVare(id) {
      try {
        await apiKall(`watched_items?id=eq.${id}`, { method: 'DELETE' });
        await lastVarer();
        oppdaterOgSynkLive();
      } catch (e) {
        visFeil("Kunne ikke slette vare: " + e.message);
      }
    }

    // Oppstart
    async function init() {
      await lastMineButikker();
      await lastOmraader();
      await lastVarer();
      oppdaterOgSynkLive();
    }

    init();
  </script>
</body>
</html>
