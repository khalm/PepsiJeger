<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PepsiJeger Test</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
    button { background: #0085ff; color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 18px; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>PepsiJeger Test 🎯</h1>
  <p id="tekst">Trykk på knappen under:</p>
  <button type="button" onclick="testKlikk()">TEST KNAPP</button>

  <script>
    function testKlikk() {
      alert("Knappen virker!");
      document.getElementById('tekst').innerText = "Knappen ble trykket og fungerer!";
    }
  </script>
</body>
</html>
