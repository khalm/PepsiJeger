<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PepsiJeger 🎯</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { color: #0085ff; margin-top: 0; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    button { background: #0085ff; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
    button:active { background: #0066cc; }
    input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 10px; font-size: 16px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #2a2a2a; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .del-btn { background: #e32934; width: auto; padding: 6px 12px; font-size: 13px; }
    .status-text { font-size: 13px; color: #aaa; margin: 8px 0; }
    #err-msg { display: none; background: #3b181a; color: #ff8080; border: 1px solid #ff4d4d; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 13px; word-break: break-word; }
    
    .deal-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 12px 0; }
    .deal-item:last-child { border-bottom: none; }
    .deal-title { font-weight: bold; font-size: 15px; color: #fff; }
    .deal-store { font-size: 12px; color: #888; margin-top: 3px; }
    .deal-price { font-size: 18px; font-weight: bold; color: #4ade80; text-align: right; }

    .chains-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .chain-label { display: flex; align-items: center; background: #2a2a2a; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .chain-label input { margin-right: 8px; width: 18px; height: 18px; }
  </style>
</head>
<body>

  <h1>PepsiJeger 🎯</h1>

  <div id="err-msg"></div>

  <!-- Dagens Funn -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="margin: 0;">🔥 Dagens Funn</h3>
      <button type="button" onclick="lastTilbud()" style="width: auto; padding: 6px 12px; font-size: 13px;">Oppdater</button>
    </div>
    <div id="deal-list">
      <p class="status-text">Laster tilbud...</p>
    </div>
  </div>

  <!-- Områder / Postnummer -->
  <div class="card">
    <h3>📍 Mine Områder / Postnummer</h3>
    <p class="status-text">Fylles ut automatisk mens du taster:</p>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="postal-input" placeholder="Postnr (f.eks. 6060)" style="flex: 1;" oninput="liveOppslagPostnr(this.value)">
      <input type="text" id="place-input" placeholder="Sted (f.eks. Hareid)" style="flex: 1.5;" oninput="liveOppslagSted(this.value)">
    </div>
    <button type="button" onclick="leggTilOmraade()">Legg til postnummer</button>
    <ul id="location-list" style="margin-top: 12px;"></ul>
  </div>

  <!-- Butikker / Kjeder -->
  <div class="card">
    <h3>🏪 Velg Butikker & Kjeder</h3>
    <p class="status-text">Huk av kjedene du vil motta tilbud fra:</p>
    <div id="chains-list" class="chains-grid"></div>
  </div>

  <!-- Overvåkningsliste -->
  <div class="card">
    <h3>🛒 Hva skal vi jakte på?</h3>
    <input type="text" id="item-input" placeholder="f.eks. Pepsi Max, Grandiosa, Ost...">
    <button type="button" onclick="leggTilVare()">Legg til i overvåking</button>
    <ul id="item-list" style="margin-top: 14px;"></ul>
  </div>

  <script>
    const SUPABASE_URL = "https://kxyahkeooiyalrnknlhd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4eWFoa2Vvb2l5YWxybmtubGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDU3NzgsImV4cCI6MjEwNTQ4MTc3OH0.oqUVTTPm8UR2cVwF9rH0asu310eTSWkQdyZEare-rww";

    function visFeil(tekst) {
      const boks = document.getElementById('err-msg');
      boks.style.display = 'block';
      boks.innerText = tekst;
    }

    function skjulFeil() {
      const boks = document.getElementById('err-msg');
      boks.style.display = 'none';
    }

    async function apiKall(sti, options = {}) {
      const headers = {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Prefer": options.prefer || "return=minimal",
        ...(options.headers || {})
      };
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${sti}`, { ...options, headers });
      if (!res.ok) {
        const errJson = await res.json().catch(() => ({ message: res.statusText }));
        throw new Error(errJson.message || "Feilkode " + res.status);
      }
      const tekst = await res.text();
      return tekst ? JSON.parse(tekst) : null;
    }

    // --- Umiddelbart Live Oppslag via Kartverket ---
    let debounceTimerSted = null;

    async function liveOppslagPostnr(verdi) {
      const postnr = verdi.trim();
      const stedFelt = document.getElementById('place-input');

      // Så fort det er 4 siffer, hent stedsnavn med en gang
      if (postnr.length === 4 && /^\d{4}$/.test(postnr)) {
        try {
          const res = await fetch(`https://ws.geonorge.no/adresser/v1/sok?sok=${encodeURIComponent(postnr)}&treffPerSide=1`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.adresser && data.adresser.length > 0) {
            stedFelt.value = data.adresser[0].poststed;
          }
        } catch (e) {
          console.warn("Feil ved live-postnr oppslag:", e);
        }
      }
    }

    function liveOppslagSted(verdi) {
      clearTimeout(debounceTimerSted);
      const sted = verdi.trim();
      const postnrFelt = document.getElementById('postal-input');

      // Vent 250 ms etter siste tastetrykk så vi ikke spammer API-et mens du skriver
      if (sted.length >= 3) {
        debounceTimerSted = setTimeout(async () => {
          try {
            const res = await fetch(`https://ws.geonorge.no/adresser/v1/sok?sok=${encodeURIComponent(sted)}&treffPerSide=1`);
            if (!res.ok) return;
            const data = await res.json();
            if (data.adresser && data.adresser.length > 0) {
              postnrFelt.value = data.adresser[0].postnummer;
            }
          } catch (e) {
            console.warn("Feil ved live-stedsnavn oppslag:", e);
          }
        }, 250);
      }
    }

    // --- Tilbud ---
    async function lastTilbud() {
      const container = document.getElementById('deal-list');
      container.innerHTML = '<p class="status-text">Laster tilbud...</p>';
      skjulFeil();

      try {
        let tilbud;
        try {
          tilbud = await apiKall('deals?select=*,stores(name)&order=id.desc', { prefer: 'return=representation' });
        } catch {
          tilbud = await apiKall('deals?select=*&order=id.desc', { prefer: 'return=representation' });
        }
        
        if (!tilbud || tilbud.length === 0) {
          container.innerHTML = '<p class="status-text">Ingen aktive tilbud funnet for dine valgte kriterier.</p>';
          return;
        }

        container.innerHTML = "";
        tilbud.forEach(d => {
          const navn = d.product_name || d.name || "Vare";
          const butikk = d.stores?.name || d.store_name || "Butikk";
          const pris = (d.price !== undefined && d.price !== null) ? `${d.price} kr` : "Tilbud";
          
          container.innerHTML += `
            <div class="deal-item">
              <div>
                <div class="deal-title">${navn}</div>
                <div class="deal-store">📍 ${butikk}</div>
              </div>
              <div class="deal-price">${pris}</div>
            </div>
          `;
        });
      } catch (e) {
        container.innerHTML = '<p class="status-text">Kunne ikke laste tilbud.</p>';
        visFeil("Feil ved henting av tilbud: " + e.message);
      }
    }

    // --- Områder / Postnummer ---
    async function lastOmraader() {
      try {
        const omraader = await apiKall('user_locations?select=*&order=created_at.asc', { prefer: 'return=representation' });
        const liste = document.getElementById('location-list');
        liste.innerHTML = "";
        (omraader || []).forEach(o => {
          liste.innerHTML += `
            <li>
              <span>📮 <strong>${o.postal_code}</strong> ${o.place_name ? `(${o.place_name})` : ''}</span>
              <button class="del-btn" onclick="slettOmraade('${o.id}')">Slett</button>
            </li>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke laste områder: " + e.message);
      }
    }

    async function leggTilOmraade() {
      skjulFeil();
      const pFelt = document.getElementById('postal-input');
      const sFelt = document.getElementById('place-input');
      const postnr = pFelt.value.trim();
      const sted = sFelt.value.trim();
      if (!postnr) return;

      try {
        await apiKall('user_locations', {
          method: 'POST',
          body: JSON.stringify({ postal_code: postnr, place_name: sted })
        });
        pFelt.value = "";
        sFelt.value = "";
        lastOmraader();
      } catch (e) {
        visFeil("Kunne ikke lagre område: " + e.message);
      }
    }

    async function slettOmraade(id) {
      try {
        await apiKall(`user_locations?id=eq.${id}`, { method: 'DELETE' });
        lastOmraader();
      } catch (e) {
        visFeil("Kunne ikke slette område: " + e.message);
      }
    }

    // --- Butikker / Kjeder ---
    async function lastKjeder() {
      try {
        const kjeder = await apiKall('selected_chains?select=*&order=chain_name.asc', { prefer: 'return=representation' });
        const boks = document.getElementById('chains-list');
        boks.innerHTML = "";
        (kjeder || []).forEach(k => {
          boks.innerHTML += `
            <label class="chain-label">
              <input type="checkbox" ${k.is_selected ? 'checked' : ''} onchange="endreKjede('${k.chain_name}', this.checked)">
              ${k.chain_name}
            </label>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke hente butikkjeder: " + e.message);
      }
    }

    async function endreKjede(chainName, status) {
      try {
        await apiKall(`selected_chains?chain_name=eq.${encodeURIComponent(chainName)}`, {
          method: 'PATCH',
          body: JSON.stringify({ is_selected: status })
        });
      } catch (e) {
        visFeil("Kunne ikke oppdatere butikkvalg: " + e.message);
      }
    }

    // --- Overvåkede varer ---
    async function lastVarer() {
      try {
        const varer = await apiKall('watched_items?select=*&order=id.asc', { prefer: 'return=representation' });
        const liste = document.getElementById('item-list');
        liste.innerHTML = "";
        (varer || []).forEach(v => {
          liste.innerHTML += `
            <li>
              <span>${v.query}</span>
              <button class="del-btn" onclick="slettVare('${v.id}')">Slett</button>
            </li>
          `;
        });
      } catch (e) {
        visFeil("Kunne ikke hente varer: " + e.message);
      }
    }

    async function leggTilVare() {
      skjulFeil();
      const felt = document.getElementById('item-input');
      const tekst = felt.value.trim();
      if (!tekst) return;

      try {
        await apiKall('watched_items', {
          method: 'POST',
          body: JSON.stringify({ query: tekst })
        });
        felt.value = "";
        lastVarer();
      } catch (e) {
        visFeil("Kunne ikke legge til vare: " + e.message);
      }
    }

    async function slettVare(id) {
      try {
        await apiKall(`watched_items?id=eq.${id}`, { method: 'DELETE' });
        lastVarer();
      } catch (e) {
        visFeil("Kunne ikke slette vare: " + e.message);
      }
    }

    // Oppstart
    lastTilbud();
    lastOmraader();
    lastKjeder();
    lastVarer();
  </script>
</body>
</html>
