<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PepsiJeger 🎯</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { color: #0085ff; display: flex; align-items: center; gap: 8px; margin-top: 0; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    button { background: #0085ff; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
    button:active { background: #0066cc; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; margin-bottom: 8px; }
    .slider-box { margin-top: 12px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .del-btn { background: #e32934; width: auto; padding: 6px 12px; font-size: 12px; }
    .badge { font-size: 12px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>PepsiJeger 🎯</h1>

  <!-- Posisjon -->
  <div class="card">
    <h3>📍 Din Posisjon & Rekkevidde</h3>
    <p id="pos-status" class="badge">Posisjon ikke hentet</p>
    <button onclick="getLocation()">Hent min posisjon</button>
    
    <div class="slider-box">
      <label>Varslingsradius: <strong id="radius-val">5</strong> km</label>
      <input type="range" id="radius" min="1" max="30" value="5" style="width:100%" oninput="document.getElementById('radius-val').innerText = this.value">
    </div>
  </div>

  <!-- Varer -->
  <div class="card">
    <h3>🛒 Hva skal vi jakte på?</h3>
    <input type="text" id="item-input" placeholder="f.eks. Pepsi Max, Grandiosa...">
    <button onclick="addItem()">Legg til i overvåking</button>
  </div>

  <!-- Liste -->
  <div class="card">
    <h3>🎯 Overvåker nå:</h3>
    <ul id="item-list"></ul>
  </div>

  <script>
    // Supabase config
    const SUPABASE_URL = "https://kxyahkeooiyalrnknlhd.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4eWFoa2Vvb2l5YWxybmtubGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDU3NzgsImV4cCI6MjEwNTQ4MTc3OH0.oqUVTTPm8UR2cVwF9rH0asu310eTSWkQdyZEare-rww";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userLat = null;
    let userLng = null;

    function getLocation() {
      const status = document.getElementById('pos-status');
      status.innerText = "Henter posisjon...";
      if (!navigator.geolocation) {
        status.innerText = "Geolokasjon støttes ikke av nettleseren.";
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          status.innerText = `Posisjon satt (${userLat.toFixed(2)}, ${userLng.toFixed(2)})`;
          saveProfile();
        },
        () => { status.innerText = "Kunne ikke hente posisjon. Sjekk tillatelser."; }
      );
    }

    async function saveProfile() {
      if (!userLat || !userLng) return;
      const radius = document.getElementById('radius').value;
      // Lagrer lokasjonen til Supabase
      console.log("Lagrer profil:", userLat, userLng, radius);
    }

    async function loadItems() {
      const { data } = await supabase.from('watched_items').select('*');
      const list = document.getElementById('item-list');
      list.innerHTML = "";
      (data || []).forEach(item => {
        list.innerHTML += `
          <li>
            <span>${item.query}</span>
            <button class="del-btn" onclick="deleteItem('${item.id}')">Slett</button>
          </li>
        `;
      });
    }

    async function addItem() {
      const input = document.getElementById('item-input');
      const query = input.value.trim();
      if (!query) return;
      await supabase.from('watched_items').insert([{ query }]);
      input.value = "";
      loadItems();
    }

    async function deleteItem(id) {
      await supabase.from('watched_items').delete().eq('id', id);
      loadItems();
    }

    loadItems();
  </script>
</body>
</html>
