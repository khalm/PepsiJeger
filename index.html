<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PepsiJeger 🎯</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
    button { background: #0085ff; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; }
    #pos-status { margin-top: 12px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <h1>PepsiJeger 🎯</h1>

  <div class="card">
    <h3>📍 Din Posisjon</h3>
    <button type="button" onclick="finnPosisjon()">Hent min posisjon</button>
    <p id="pos-status">Trykk på knappen over for å hente GPS</p>
  </div>

  <script>
    function finnPosisjon() {
      const status = document.getElementById('pos-status');
      status.innerText = "Henter posisjon...";

      if (!navigator.geolocation) {
        status.innerText = "Geolokasjon støttes ikke av denne nettleseren.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(4);
          const lng = pos.coords.longitude.toFixed(4);
          status.innerText = "Posisjon funnet! Lat: " + lat + ", Lng: " + lng;
        },
        (err) => {
          status.innerText = "Feil (" + err.code + "): " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  </script>
</body>
</html>
